# Verify install — animated-3d-story-program
# Fresh-install verification on GitHub's machines: a fresh ubuntu-latest
# runner IS a fresh machine. Runs automatically when the program or this
# workflow changes, or manually from the Actions tab.
# Checks: install.sh end-to-end, then npm run typecheck (must exit 0).
name: Verify install — animated-3d-story-program

on:
  push:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'install.sh'
      - '.github/workflows/verify-install.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install ffmpeg (if missing)
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Install the program
        run: bash install.sh
      - name: Typecheck
        run: npm run typecheck
